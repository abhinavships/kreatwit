# fly.toml app configuration file generated for wellops-copilot on 2026-11-16T19:52:27+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'wellops-copilot'
primary_region = 'sin'

[build]
[env]
  CORS_ORIGINS = 'https://wellops-copilot.fly.dev'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
